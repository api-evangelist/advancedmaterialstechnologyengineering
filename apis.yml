aid: advancedmaterialstechnologyengineering
name: Advanced Materials Technology & Engineering
description: 'Advanced Materials Technology & Engineering, Inc. (AMTE; Chinese entity 无锡邑文微电子科技股份有限公司,
  Wuxi Yiwen Microelectronics Technology / 邑文科技) is a Chinese semiconductor capital-equipment maker
  founded in 2011 and headquartered at No. 1 Guanshan Road, Wuxi, Jiangsu, with a production center
  at No. 1 Jinshan Road, Rudong, Nantong that runs more than 2,000 square meters of class-10,000
  cleanroom plus a class-1,000 specialty-gas process laboratory. AMTE designs and manufactures
  front-end wafer-fabrication equipment — plasma etch systems and thin-film deposition (PECVD)
  systems — for IC and OSD production, with a stated focus on compound semiconductor, MEMS and
  advanced-packaging process lines; the company says its tools qualified into 12-inch fabs including
  SMIC and SK Hynix from 2016-2017, and it holds Chinese national high-tech enterprise status (2017)
  and ISO 9001 certification (2015). It raised a Series D of more than RMB 550 million (about USD
  70.5 million) in 2024, co-led by CICC Capital and a Haitong Securities alternative-investment
  vehicle, and its shares appear on the EquityZen secondary marketplace, which is how the company
  entered the API Evangelist harvest backlog. AMTE sells physical process equipment, refurbished
  tools, spare parts and field service — not software. It operates no developer program, publishes
  no public API, and serves no machine-readable API contract of any kind.'
